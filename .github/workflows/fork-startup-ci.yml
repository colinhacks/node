name: Fork startup validation

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14'
  RUSTC_VERSION: '1.86'
  CLANG_VERSION: '19'

jobs:
  linux:
    name: Linux ${{ matrix.name }} (${{ matrix.variant }})
    if: github.repository == 'colinhacks/node'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: ubuntu-24.04
            variant: baseline
          - name: x64
            runner: ubuntu-24.04
            variant: candidate
          - name: arm64
            runner: ubuntu-24.04-arm
            variant: baseline
          - name: arm64
            runner: ubuntu-24.04-arm
            variant: candidate
    env:
      CC: clang-19
      CXX: clang++-19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'baseline' && '8af75451e9041cd6058080ad3d4a65546797b418' || github.sha }}

      - name: Prepare logs
        shell: bash
        run: |
          LOG_DIR="$RUNNER_TEMP/fork-startup-ci-logs"
          mkdir -p "$LOG_DIR"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"

      - name: Install Clang ${{ env.CLANG_VERSION }}
        uses: ./.github/actions/install-clang
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION"
          rustup --version

      - name: Record source and toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short
            git log -1 --format=fuller
            git rev-parse HEAD
            git submodule status --recursive
            uname -a
            lscpu
            python3 --version
            clang-19 --version
            clang++-19 --version
            rustc --version --verbose
            make --version
          } | tee "$LOG_DIR/provenance.txt"

      - name: Build release Node.js
        shell: bash
        run: |
          set -o pipefail
          make build-ci -j4 V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support" 2>&1 | tee "$LOG_DIR/build.txt"

      - name: Run JavaScript, native, addon, and documentation suites
        shell: bash
        run: |
          set -o pipefail
          make test-ci -j1 V=1 TEST_CI_ARGS="-p actions" 2>&1 | tee "$LOG_DIR/test.txt"

      - name: Verify test cleanliness
        shell: bash
        run: |
          set -o pipefail
          git add -A && git diff --name-only --exit-code --staged 2>&1 | tee "$LOG_DIR/tree-cleanliness.txt"

      - name: Collect build evidence
        if: ${{ always() }}
        shell: bash
        run: |
          [ ! -e config.gypi ] || cp config.gypi "$LOG_DIR/config.gypi"
          [ ! -e test.tap ] || cp test.tap "$LOG_DIR/test.tap"
          [ ! -e out/junit/cctest.xml ] || cp out/junit/cctest.xml "$LOG_DIR/cctest.xml"
          [ ! -e out/Release/node ] || sha256sum out/Release/node > "$LOG_DIR/node.sha256"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fork-startup-ci-linux-${{ matrix.name }}-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  macos-arm64:
    name: macOS arm64 (${{ matrix.variant }})
    if: github.repository == 'colinhacks/node'
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      CC: gcc
      CXX: g++
      XCODE_VERSION: '16.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'baseline' && '8af75451e9041cd6058080ad3d4a65546797b418' || github.sha }}

      - name: Prepare logs
        shell: bash
        run: |
          LOG_DIR="$RUNNER_TEMP/fork-startup-ci-logs"
          mkdir -p "$LOG_DIR"
          echo "LOG_DIR=$LOG_DIR" >> "$GITHUB_ENV"

      - name: Verify arm64 runner
        shell: bash
        run: test "$(uname -m)" = arm64

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Set up Xcode ${{ env.XCODE_VERSION }}
        run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        run: |
          rustup override set "$RUSTC_VERSION"
          rustup --version

      - name: Record source and toolchain
        shell: bash
        run: |
          set -o pipefail
          {
            git status --short
            git log -1 --format=fuller
            git rev-parse HEAD
            git submodule status --recursive
            uname -a
            sw_vers
            xcodebuild -version
            python3 --version
            clang --version
            rustc --version --verbose
            make --version
          } | tee "$LOG_DIR/provenance.txt"

      - name: Install documentation dependencies
        shell: bash
        run: |
          set -o pipefail
          make tools/doc/node_modules 2>&1 | tee "$LOG_DIR/doc-dependencies.txt"

      - name: Free disk space
        shell: bash
        run: |
          df -h | tee "$LOG_DIR/disk-before-cleanup.txt"
          sudo rm -rf /Users/runner/Library/Android/sdk
          df -h | tee "$LOG_DIR/disk-after-cleanup.txt"

      - name: Build release Node.js
        shell: bash
        run: |
          set -o pipefail
          make build-ci -j"$(getconf _NPROCESSORS_ONLN)" V=1 CONFIG_FLAGS="--error-on-warn --v8-enable-temporal-support" 2>&1 | tee "$LOG_DIR/build.txt"

      - name: Run JavaScript, native, addon, and documentation suites
        shell: bash
        run: |
          set -o pipefail
          make test-ci -j1 V=1 TEST_CI_ARGS="-p actions" 2>&1 | tee "$LOG_DIR/test.txt"

      - name: Verify test cleanliness
        shell: bash
        run: |
          set -o pipefail
          git add -A && git diff --name-only --exit-code --staged 2>&1 | tee "$LOG_DIR/tree-cleanliness.txt"

      - name: Collect build evidence
        if: ${{ always() }}
        shell: bash
        run: |
          [ ! -e config.gypi ] || cp config.gypi "$LOG_DIR/config.gypi"
          [ ! -e test.tap ] || cp test.tap "$LOG_DIR/test.tap"
          [ ! -e out/junit/cctest.xml ] || cp out/junit/cctest.xml "$LOG_DIR/cctest.xml"
          [ ! -e out/Release/node ] || shasum -a 256 out/Release/node > "$LOG_DIR/node.sha256"

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fork-startup-ci-macos-arm64-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

  windows-x64:
    name: Windows x64 (${{ matrix.variant }})
    if: github.repository == 'colinhacks/node'
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.variant == 'baseline' && '8af75451e9041cd6058080ad3d4a65546797b418' || github.sha }}

      - name: Prepare logs
        shell: pwsh
        run: |
          $logDir = Join-Path $env:RUNNER_TEMP 'fork-startup-ci-logs'
          New-Item -ItemType Directory -Force $logDir | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "LOG_DIR=$logDir"

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: true

      - name: Install NASM
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Install Rust ${{ env.RUSTC_VERSION }}
        shell: pwsh
        run: |
          rustup override set "$env:RUSTC_VERSION"
          rustup --version

      - name: Record source and toolchain
        shell: pwsh
        run: |
          $provenance = Join-Path $env:LOG_DIR 'provenance.txt'
          @(
            git status --short
            git log -1 --format=fuller
            git rev-parse HEAD
            git submodule status --recursive
            systeminfo
            python --version
            rustc --version --verbose
            nasm --version
            cmd.exe /d /c '"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationVersion'
          ) | Tee-Object -FilePath $provenance

      - name: Build and run native, addon, and documentation suites
        id: native
        shell: pwsh
        run: |
          $nativeLog = Join-Path $env:LOG_DIR 'native.txt'
          .\vcbuild.bat release vs2022 clang-cl v8temporal test-ci-native *>&1 | Tee-Object -FilePath $nativeLog
          $nativeExit = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "NATIVE_EXIT_CODE=$nativeExit"
          if (Test-Path test.tap) { Copy-Item test.tap (Join-Path $env:LOG_DIR 'native.tap') }
          if (Test-Path cctest.junit.xml) { Copy-Item cctest.junit.xml (Join-Path $env:LOG_DIR 'cctest.junit.xml') }
          exit $nativeExit

      - name: Run JavaScript suites without rebuilding Node.js
        if: ${{ !cancelled() && steps.native.outcome != 'skipped' }}
        shell: pwsh
        run: |
          $javascriptLog = Join-Path $env:LOG_DIR 'javascript.txt'
          if (!(Test-Path Release\node.exe)) {
            'Release\\node.exe was not produced; JavaScript suites cannot run.' | Tee-Object -FilePath $javascriptLog
            Add-Content -Path $env:GITHUB_ENV -Value 'JAVASCRIPT_EXIT_CODE=1'
            exit 0
          }
          .\vcbuild.bat release vs2022 clang-cl noprojgen nobuild test-ci-js *>&1 | Tee-Object -FilePath $javascriptLog
          $javascriptExit = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "JAVASCRIPT_EXIT_CODE=$javascriptExit"
          if (Test-Path test.tap) { Copy-Item test.tap (Join-Path $env:LOG_DIR 'javascript.tap') }
          exit 0

      - name: Verify test cleanliness
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $cleanlinessLog = Join-Path $env:LOG_DIR 'tree-cleanliness.txt'
          git add -A
          $addExit = $LASTEXITCODE
          if ($addExit -ne 0) {
            Add-Content -Path $env:GITHUB_ENV -Value "CLEANLINESS_EXIT_CODE=$addExit"
            exit 0
          }
          git diff --name-only --exit-code --staged *>&1 | Tee-Object -FilePath $cleanlinessLog
          $cleanlinessExit = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "CLEANLINESS_EXIT_CODE=$cleanlinessExit"
          exit 0

      - name: Collect build evidence
        if: ${{ always() }}
        shell: pwsh
        run: |
          if (Test-Path config.gypi) { Copy-Item config.gypi (Join-Path $env:LOG_DIR 'config.gypi') }
          if (Test-Path test.tap) { Copy-Item test.tap (Join-Path $env:LOG_DIR 'last-test.tap') }
          if (Test-Path cctest.junit.xml) { Copy-Item cctest.junit.xml (Join-Path $env:LOG_DIR 'cctest.junit.xml') }
          if (Test-Path Release\node.exe) {
            Get-FileHash -Algorithm SHA256 Release\node.exe | Format-List * | Out-File (Join-Path $env:LOG_DIR 'node.sha256.txt')
          }

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fork-startup-ci-windows-x64-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LOG_DIR }}
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve test failure verdict
        if: ${{ always() }}
        shell: pwsh
        run: |
          $nativeExit = [int]($env:NATIVE_EXIT_CODE ?? '1')
          $javascriptExit = [int]($env:JAVASCRIPT_EXIT_CODE ?? '1')
          $cleanlinessExit = [int]($env:CLEANLINESS_EXIT_CODE ?? '1')
          if ($nativeExit -ne 0) { exit $nativeExit }
          if ($javascriptExit -ne 0) { exit $javascriptExit }
          if ($cleanlinessExit -ne 0) { exit $cleanlinessExit }
